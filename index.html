<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/awe.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ovo&family=Zalando+Sans+Expanded:wght@400;600;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AWE Character Creation</title>
  </head>
  <body>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('awe-theme');
          if (t) {
            var p = JSON.parse(t);
            if (p.mode) document.documentElement.setAttribute('data-theme', p.mode);
            if (p.color) document.documentElement.setAttribute('data-color', p.color);
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.setAttribute('data-color', 'monochrome');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
